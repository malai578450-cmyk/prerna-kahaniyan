<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prerna Kahaniyan - 100 Motivational Stories</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

header{
background:linear-gradient(135deg,#ff8a00,#ff3d00);
color:white;
text-align:center;
padding:30px 15px;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
}

.search{
width:90%;
max-width:650px;
margin:20px auto;
display:block;
padding:14px 18px;
border:1px solid #ddd;
border-radius:30px;
font-size:16px;
}

.categories{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
padding:0 10px 20px;
background:white;
}

.categories button{
border:0;
border-radius:25px;
padding:11px 16px;
background:#ff6347;
color:white;
font-size:14px;
}

main{
max-width:850px;
margin:auto;
padding:20px 15px;
}

.title{
text-align:center;
margin-bottom:25px;
}

.story{
background:white;
border-radius:18px;
padding:20px;
margin-bottom:18px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.tag{
display:inline-block;
background:#fff0cf;
padding:7px 12px;
border-radius:20px;
}

.story h2{
color:#e4572e;
font-size:22px;
}

.story p{
font-size:16px;
line-height:1.8;
}

.lesson{
background:#fff4d8;
padding:13px;
border-radius:12px;
font-weight:bold;
}

footer{
background:#222;
color:white;
text-align:center;
padding:25px;
}
</style>
</head>

<body>

<header>
<h1>🌟 Prerna Kahaniyan</h1>
<p>100 प्रेरणादायक कहानियाँ • हर कहानी में एक नई सीख</p>
</header>

<input
class="search"
id="search"
type="search"
placeholder="🔎 कहानी खोजें..."
>

<div class="categories">

<button onclick="filterStories('all')">
🏠 सभी
</button>

<button onclick="filterStories('मेहनत')">
💪 मेहनत
</button>

<button onclick="filterStories('Students')">
🎓 Students
</button>

<button onclick="filterStories('Life')">
❤️ Life
</button>

<button onclick="filterStories('Confidence')">
🔥 Confidence
</button>

</div>

<main>

<h1 class="title">
📖 100 Motivational Stories
</h1>

<div id="stories">

<!-- PART 2 KI STORIES YAHAN AAYENGI -->

</div>

<div id="noResult" style="display:none;text-align:center;">
😔 कोई कहानी नहीं मिली।
</div>

</main>

<footer>
© 2026 Prerna Kahaniyan ❤️
</footer>

<script>

const stories=document.querySelectorAll(".story");

const search=document.getElementById("search");

let currentCategory="all";

function filterStories(category){

currentCategory=category;

search.value="";

showStories();

}

function showStories(){

let text=search.value.toLowerCase();

let count=0;

document.querySelectorAll(".story").forEach(function(story){

let categoryOK=
currentCategory==="all" ||
story.dataset.category===currentCategory;

let searchOK=
story.innerText.toLowerCase().includes(text);

if(categoryOK && searchOK){

story.style.display="block";
count++;

}else{

story.style.display="none";

}

});

document.getElementById("noResult").style.display=
count===0 ? "block" : "none";

}

search.addEventListener("input",showStories);

</script>

</body>
</html>
